<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Demo virtual</title>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
                    "three/GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/GLTFLoader.js",
                    "three/RGBELoader": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/RGBELoader.js",
                    "three/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.js"
                }
            }
        </script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

        <style>
            :root {
                --slide-height: 150px;
                --slide-height-sm: 80px;
            }
            body {
                padding: 0;
                margin: 0;
                font-family: 'Roboto';
            }
            * {
                box-sizing: border-box;
            }
            .modal-wrapper {
                position: fixed;
                inset: 0;
                background-color: #00000082;
                z-index: -1;
                opacity: 0;
                /* display: flex;
                justify-content: center; */
                padding: 40px 20px 0px;
                transition: all ease-in-out 0.3s;

                display: flex;
                align-items: center;
                /* bottom: 168px; */
                padding-bottom: calc(var(--slide-height) + 45px);
            }
            .modal-inner {
                /* background-color: #fff; */
                border-radius: 5px;
                /* box-shadow: 0px 0px 10px 10px rgba(0, 0, 0, 0.5); */
                padding: 20px 20px;
                /* min-width: 500px; */
                /* max-height: 1000px; */
                /* min-height: 600px; */
                margin-left: auto;
                margin-right: auto;
                position: relative;
                /* padding-top: 35px; */
                /* max-height: 60vh; */
                /* max-width: 80%; */
                height: 100%;
                max-height: calc(100vh - var(--slide-height));
                display: flex;
                align-items: center;
            }
            .modal-inner img {
                /* height: 100%; */
                max-height: 100%;
                object-fit: contain;
                aspect-ratio: auto 573 / 322;
                border-radius: 8px;
                opacity: 1;
                animation: appear 0.4s ease-in-out forwards;
                transform-origin: center center;
            }

            @keyframes appear {
                from {
                    opacity: 0;
                    transform: scale(0.8); /* smaller at start */
                }
                to {
                    opacity: 1;
                    transform: scale(1); /* full size */
                }
            }
            .modal-container {
                width: 100%;
                height: 100%;
                text-align: center;
                display: flex;
                flex-direction: column;
                justify-content: center;
                /* max-height: 61vh; */
                position: relative;
                z-index: 1;
            }
            @media (max-width: 540px) {
                .modal-inner {
                    padding: 32px 10px 10px;
                }
            }
            .title {
                font-size: 32px;
                font-weight: 400;
                margin-bottom: 20px;
            }

            .modal-wrapper .modal-close {
                border: unset;
                font-size: 18px;
                color: #000;
                text-decoration: underline;
                position: absolute;
                right: 0;
                top: 0;
                cursor: pointer;
                transition: all linear 0.2s;
                /* background: #ffffffbd; */
                padding: 7px 11px;
                border-radius: 8px;
                z-index: 10;
            }
            .modal-wrapper .modal-close:hover {
                transform: scale(1.1);
            }
            .content {
                font-size: 18px;
            }

            .modal-wrapper.open {
                z-index: 222;
                opacity: 1;
            }
            .footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 999;
            }
            .slider-wrapper {
                position: relative;
            }
            .slider-wrapper.thumnail {
                background-color: #fff;
                padding: 20px;
                border-radius: 8px;
                box-sizing: border-box;
            }
            .slider-wrapper.slider-wrapper.thumnail .slider-wrapper__inner {
                padding-top: 20px;
                border-top: 2px solid #ccc;
            }
            .slider-wrapper__inner {
                overflow-x: scroll;
                overflow-y: hidden;
            }
            .slider {
                --width: 25vw;
                display: inline-flex;
                flex-wrap: nowrap;
            }
            .slider img {
                width: 100%;
                height: 100%;
            }

            .slide {
                /* width: var(--width); */
                height: var(--slide-height);
                position: relative;
                /* height: calc(var(--width) / 2); */
                aspect-ratio: auto 573 / 322;
            }

            .slider-wrapper.thumnail .slide {
                height: var(--slide-height-sm);
            }
            .slider-wrapper.thumnail {
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            .main-slide {
                height: calc(100% - var(--slide-height-sm) - 40px);
            }
            .main-slide > div {
                display: flex;
                flex-direction: column;
                justify-content: center;
                height: 100%;
            }
            .main-slide .slider-wrapper__inner {
                height: var(--slide-height);
            }
            .main-slide img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                min-height: 0;
            }
            @media (max-width: 768px) and (min-width: 481px) {
                .slider {
                    --width: 300px;
                }
            }
            @media (max-width: 480px) {
                .slider {
                    --width: 200px;
                }
            }

            .slide:hover::before,
            .slide.active:before {
                content: '';
                position: absolute;
                inset: 0;
                border-bottom: 5px solid #d41d51;
            }
            .btn-next,
            .btn-pre {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: unset;
                border: unset;
                transition: all linear 0.2s;
                height: 50px;
                width: 50px;
                display: flex;
                align-items: center;
                justify-content: center;

                color: #292929;

                font-size: 28px;
                background-color: #fff;
                color: #292929;
                border-radius: 100%;
                cursor: pointer;
                box-shadow: 0px 0px 5px 2px rgba(0, 0, 0, 0.1);
            }
            .btn-next:hover,
            .btn-pre:hover {
                background: #6f42c1;
                color: #fff;
            }
            .btn-next {
                right: 0;
            }
            .btn-pre {
                left: 0;
            }
            #model-center {
                position: fixed;
                top: 10px;
                right: 10px;
                z-index: 2;
                background-color: unset;
                border: unset;
                font-size: 40px;
                /* color: #fff; */
                transition: all linear 0.2s;
                cursor: pointer;
            }
            #model-center:hover {
                transform: scale(1.3);
            }

            #employeeStoriesSlider .slider {
                width: 100%;
            }
            #momensSlider .slider {
                --width: 10vw;
            }

            /* #momensModal.open,
            #employeeStoriesModal.open {
                z-index: 999;
            } */

            .explore-link {
                font-size: 20px;

                text-decoration: underline;
                text-transform: uppercase;
                font-style: italic;
                margin-top: 10px;
                font-weight: 500;
                transition: all linear 0.1s;
                color: #ffffff;
                margin-left: auto;
                margin-right: auto;
                margin-top: 10px;
                background: #cccccc3d;
                padding: 7px;
            }
            .explore-link.secondary {
                color: #292929;
            }

            .explore-link:hover {
                color: #d41d51;
            }

            .modal-inner {
                max-width: 1300px;
                width: 100%;
            }
            @media (max-width: 540px) {
                :root {
                    --slide-height: 100px;
                    --slide-height: 50px;
                }
                .explore-link {
                    font-size: 16px;
                }
            }
        </style>
    </head>
    <body>
        <button id="model-center">
            <svg
                stroke="currentColor"

                stroke-width="0"
                viewBox="0 0 24 24"
                height="1em"
                width="1em"

                <path
                    d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm-7 7H3v4c0 1.1.9 2 2 2h4v-2H5v-4zM5 5h4V3H5c-1.1 0-2 .9-2 2v4h2V5zm14-2h-4v2h4v4h2V5c0-1.1-.9-2-2-2zm0 16h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4z"
                ></path>
            </svg>
        </button>

            <div id="modal-container"></div>
            <button class="modal-close">x</button>
        </div> -->
        <!-- <div id="log"></div> -->
        <div class="footer"></div>

        <div id="container"></div>
        <script type="module" src="./main.js"></script>
    </body>
</html>
